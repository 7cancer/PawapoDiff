name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test offline installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify installation and record checksum
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PawapoDiff-Windows-Setup
          path: |
            dist/PawapoDiff-Setup.exe
            dist/PawapoDiff-Setup.exe.sha256
            dist/PawapoDiff-Portable.zip
            dist/PawapoDiff-Portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

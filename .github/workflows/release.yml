name: Publish GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test offline installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify installation and record checksum
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - name: Publish preview release with installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" ./dist/PawapoDiff-Setup.exe ./dist/PawapoDiff-Setup.exe.sha256 ./dist/PawapoDiff-Portable.zip ./dist/PawapoDiff-Portable.zip.sha256 --verify-tag --title "PawapoDiff $env:RELEASE_TAG - Preview" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE) { throw 'Release publication failed' }
